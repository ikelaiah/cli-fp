<svg xmlns="http://www.w3.org/2000/svg" width="1983" height="793" viewBox="0 0 1983 793" role="img" aria-labelledby="title description">
  <title id="title">cli-fp: A CLI framework for Free Pascal</title>
  <desc id="description">A command prompt and cli-fp wordmark beside a terminal command tree on a deep blue and purple background.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1983" y2="793" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#01050f"/>
      <stop offset="0.48" stop-color="#06152f"/>
      <stop offset="0.72" stop-color="#0d1133"/>
      <stop offset="1" stop-color="#220b3d"/>
    </linearGradient>
    <radialGradient id="blue-depth" cx="0" cy="0" r="1" gradientTransform="translate(790 410) rotate(12) scale(825 510)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2b67" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b2b67" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-depth" cx="0" cy="0" r="1" gradientTransform="translate(1810 180) rotate(126) scale(640 490)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#431667" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#431667" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand-blue" x1="110" y1="230" x2="970" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2583ff"/>
      <stop offset="1" stop-color="#0752f2"/>
    </linearGradient>
    <linearGradient id="brand-white" x1="320" y1="235" x2="640" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7ecf5"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="72" x2="178" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6640d8"/>
      <stop offset="1" stop-color="#1675ff"/>
    </linearGradient>
    <linearGradient id="purple-pill" x1="1410" y1="350" x2="1810" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#522c93" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#32205c" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="amber-pill" x1="1410" y1="510" x2="1810" y2="635" gradientUnits="userSpaceOnUse">
      <stop stop-color="#614018" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#3b2815" stop-opacity="0.66"/>
    </linearGradient>
    <pattern id="dot-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.45" fill="#2578dd" opacity="0.72"/>
    </pattern>
    <filter id="blue-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="7" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1983" height="793" fill="url(#background)"/>
  <rect width="1983" height="793" fill="url(#blue-depth)"/>
  <rect width="1983" height="793" fill="url(#purple-depth)"/>
  <rect x="28" y="28" width="1927" height="737" fill="url(#dot-grid)" opacity="0.8"/>

  <path d="M0 140h84c26 0 48-21 48-48s19-24 45-24" fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9" opacity="0.9"/>

