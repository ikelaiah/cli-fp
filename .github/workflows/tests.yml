name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cli-fp-gen/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'tools/cli-fp-gen/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  linux:
    name: Linux / FPC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl python3
      - name: Framework Unit Tests
        run: bash tests/run_tests.sh
      - name: Generator Unit Tests
        run: bash tests/codegen/run_unit_tests.sh
      - name: Golden Output Test
        run: bash tests/codegen/run_golden_test.sh
      - name: Generator Ops Test
        run: bash tests/codegen/run_ops_test.sh
      - name: Compile Smoke Test
        run: bash tests/codegen/run_compile_smoke.sh

  windows:
    name: Windows / FPC
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Free Pascal
        shell: powershell
        run: |
          choco install freepascal --version=3.2.2 --yes --no-progress --forcex86
          'C:\tools\freepascal\bin\i386-win32' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & 'C:\tools\freepascal\bin\i386-win32\fpc.exe' -iV
          & 'C:\tools\freepascal\bin\i386-win32\fpc.exe' -iTP
          & 'C:\tools\freepascal\bin\i386-win32\fpc.exe' -iTO
      - name: Framework Unit Tests
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\run_tests.ps1
      - name: Codegen Test Suite
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\codegen\run_all_tests.ps1
