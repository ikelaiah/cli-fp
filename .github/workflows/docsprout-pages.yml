# DocSprout v1.1.1 historical Pages workflow.
# This documented manual caller publishes immutable release-tag documentation.
name: DocSprout Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  documentation:
    uses: ikelaiah/docsprout/.github/workflows/publish-docs.yml@v1.1.1
    permissions:
      contents: read
      pages: write
      id-token: write
