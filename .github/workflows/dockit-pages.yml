# DocKit v1.0.0 historical Pages workflow.
# This documented manual caller publishes immutable release-tag documentation.
name: DocKit Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  documentation:
    uses: ikelaiah/dockit-fp/.github/workflows/publish-docs.yml@v1.0.0
    permissions:
      contents: read
      pages: write
      id-token: write
