# DocKit managed workflow: github-pages v1
# Generated by DocKit. Update with `dockit-fp github-pages --update`.
name: DocKit Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ikelaiah/dockit-fp/.github/workflows/publish-docs.yml@v0.18.0
    with:
      versioned: false
      release: latest
    permissions:
      contents: read
      pages: write
      id-token: write
